name: Deploy AttendanceBot
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  cancel-in-progress: false
  group: "pages"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # FIXED: This single step builds your site and pushes it to pages cleanly
      - name: Deploy to GitHub Pages
        id: deployment
        uses: retypeapp/action-github-pages@v3
